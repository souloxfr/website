<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>souloxfr</title>
<meta name="description" content="souloxfr's Hello Neighbor mods and workshop releases. Explore HomeFullOfKeys and more.">
<meta property="og:title" content="souloxfr | Workshop">
<meta property="og:description" content="Custom Hello Neighbor mods created by souloxfr.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
html{
scroll-behavior:smooth;
}
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'JetBrains Mono', monospace;
}
body{
background:#0B132B;
color:white;
overflow-x:hidden;
}
/* Soft moving circles (25% opacity) that merge */
body::before{
content:"";
position:fixed;
inset:-50%;
background:
radial-gradient(circle at 15% 20%, rgba(58,80,107,0.25), transparent 22%),
radial-gradient(circle at 85% 25%, rgba(28,37,65,0.25), transparent 25%),
radial-gradient(circle at 25% 70%, rgba(58,80,107,0.25), transparent 24%),
radial-gradient(circle at 75% 75%, rgba(28,37,65,0.25), transparent 23%),
radial-gradient(circle at 50% 40%, rgba(58,80,107,0.22), transparent 28%),
radial-gradient(circle at 40% 85%, rgba(28,37,65,0.22), transparent 20%),
linear-gradient(130deg, #0B132B, #1C2541, #0B132B);
background-size: 180% 180%;
animation: circleMove 22s ease-in-out infinite;
z-index:-2;
}
@keyframes circleMove{
0%{
background-position:
0% 0%,
100% 0%,
0% 100%,
100% 100%,
50% 50%,
30% 80%,
0% 0%;
}
25%{
background-position:
20% 30%,
80% 20%,
30% 70%,
70% 80%,
60% 40%,
50% 60%,
0% 0%;
}
50%{
background-position:
40% 10%,
60% 40%,
10% 60%,
90% 50%,
40% 70%,
70% 30%,
0% 0%;
}
75%{
background-position:
10% 40%,
90% 10%,
40% 90%,
60% 30%,
70% 50%,
20% 70%,
0% 0%;
}
100%{
background-position:
0% 0%,
100% 0%,
0% 100%,
100% 100%,
50% 50%,
30% 80%,
0% 0%;
}
}
.grid{
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(58,80,107,0.18) 1px,transparent 1px),
linear-gradient(90deg,rgba(58,80,107,0.18) 1px,transparent 1px);
background-size:60px 60px;
background-position: -1000px -1000px;
z-index:-1;
}
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:30px 8%;
border-bottom:1px solid rgba(58,80,107,0.4);
}
.logo{
font-size:25px;
font-weight:700;
text-decoration:none;
color:white;
}
.logo span{
color:#3A506B;
}
.back-link{
color:#a0b0c0;
text-decoration:none;
font-size:14px;
transition:color 0.2s;
}
.back-link:hover{
color:white;
}
section{
width:85%;
margin:80px auto;
}
.title{
text-align:center;
margin-bottom:50px;
}
.title h1{
font-size:42px;
margin-bottom:12px;
}
.title p{
color:#8a9aaa;
}
.feature{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
margin-bottom:60px;
}
.feature img{
width:100%;
height:350px;
object-fit:cover;
border-radius:20px;
background:#1C2541;
}
.box{
background:#1C2541;
border:1px solid rgba(58,80,107,0.5);
border-radius:20px;
padding:30px;
}
.box p{
color:#a0b0c0;
line-height:1.7;
margin:15px 0;
}
.status{
display:inline-block;
background:#3A506B;
padding:7px 15px;
border-radius:20px;
font-size:14px;
margin-bottom:12px;
}
.button{
padding:15px 30px;
border-radius:14px;
text-decoration:none;
display:inline-block;
transition:all 0.25s ease;
}
.primary{
background:#3A506B;
color:white;
}
.primary:hover{
background:#4a6485;
transform:translateY(-2px);
}
.coming-soon{
text-align:center;
padding:60px 20px;
background:#1C2541;
border:1px dashed rgba(58,80,107,0.6);
border-radius:20px;
color:#8a9aaa;
}
.coming-soon h3{
color:white;
margin-bottom:10px;
}
footer{
text-align:center;
padding:40px;
color:#6a7a8a;
border-top:1px solid rgba(58,80,107,0.4);
margin-top:80px;
}
@media(max-width:700px){
.feature{
grid-template-columns:1fr;
}
.title h1{
font-size:32px;
}
}
</style>
</head>
<body>
<div class="grid"></div>

  <a href="index.html" class="back-link">← Back to Home</a>
</nav>

  <div
