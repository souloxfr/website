<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>souloxfr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-start: #e8e4df;
      --bg-end: #d4d0cb;
      --window-bg: rgba(255, 255, 255, 0.72);
      --window-border: rgba(0, 0, 0, 0.08);
      --titlebar-bg: rgba(245, 243, 240, 0.85);
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --dock-bg: rgba(255, 255, 255, 0.55);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.18), 0 8px 24px rgba(0, 0, 0, 0.08);
      --radius: 12px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      color: var(--text);
      background: #0a0a12;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url('https://kappa.lol/u30GRX');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .desktop::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(100,160,255,0.08) 0%, transparent 50%),
        radial-gradient(ellipse 70% 50% at 80% 70%, rgba(40,60,120,0.12) 0%, transparent 50%);
      pointer-events: none;
    }

    .menu-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 28px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      z-index: 1000;
    }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .apple-logo {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1d1d1f;
      border-radius: 5px;
    }

    .apple-logo svg {
      width: 11px;
      height: 11px;
      fill: #fff;
    }

    .menu-item {
      cursor: default;
      opacity: 0.85;
      transition: opacity 0.15s;
    }

    .menu-item:hover,
    .menu-item.active {
      opacity: 1;
    }

    .menu-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .menu-icon {
      display: flex;
      align-items: center;
      opacity: 0.7;
    }

    .menu-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .time {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .desktop-icons {
      position: absolute;
      top: 48px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      z-index: 10;
    }

    .desk-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 80px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .desk-icon:hover {
      transform: scale(1.06);
    }

    .desk-icon:active {
      transform: scale(0.96);
    }

    .icon-img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.5);
    }

    .icon-img svg {
      width: 28px;
      height: 28px;
    }

    .desk-icon span {
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 8px rgba(0,0,0,0.4);
      line-height: 1.2;
      max-width: 90px;
    }

    #windows-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    .window {
      position: absolute;
      min-width: 320px;
      min-height: 220px;
      background: var(--window-bg);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--window-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      animation: windowOpen 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes windowOpen {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .window.focused {
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.22), 0 12px 32px rgba(0, 0, 0, 0.1);
      z-index: 200 !important;
    }

    .window.minimized {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.6) translateY(80px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .window.maximized {
      top: 28px !important;
      left: 0 !important;
      width: 100vw !important;
      height: calc(100vh - 28px - 70px) !important;
      border-radius: 0;
    }

    .titlebar {
      height: 40px;
      background: var(--titlebar-bg);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      padding: 0 14px;
      cursor: grab;
      flex-shrink: 0;
    }

    .titlebar:active {
      cursor: grabbing;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
      margin-right: 12px;
    }

    .tl {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }

    .tl:hover {
      filter: brightness(0.9);
      transform: scale(1.08);
    }

    .tl.close { background: #ff5f57; }
    .tl.minimize { background: #febc2e; }
    .tl.maximize { background: #28c840; }

    .title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      pointer-events: none;
      margin-right: 48px;
    }

    .window-content {
      flex: 1;
      overflow: auto;
      padding: 24px 28px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
    }

    .window-content::-webkit-scrollbar {
      width: 8px;
    }
    .window-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .window-content::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 4px;
    }

    .content-header {
      margin-bottom: 20px;
    }

    .content-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .content-header p {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(0, 113, 227, 0.1);
      color: var(--accent);
      margin-top: 8px;
    }

    .badge.vr {
      background: rgba(90, 60, 160, 0.1);
      color: #5a3ca0;
    }

    .badge.roblox {
      background: rgba(0, 160, 100, 0.1);
      color: #008a55;
    }

    .section {
      margin-bottom: 22px;
    }

    .section h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .section p {
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .feature-list {
      list-style: none;
      margin-top: 10px;
    }

    .feature-list li {
      padding: 6px 0;
      padding-left: 18px;
      position: relative;
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .feature-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 11px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .card {
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .card .tag {
      display: inline-block;
      margin-top: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.5);
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.04);
      text-decoration: none;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
      transition: background 0.15s;
    }

    .contact-link:hover {
      background: rgba(255,255,255,0.85);
    }

    .contact-link .link-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-link .link-icon svg {
      width: 18px;
      height: 18px;
    }

    .terminal-body {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      padding: 16px 20px;
      height: 100%;
      line-height: 1.6;
      overflow: auto;
      cursor: text;
    }

    .terminal-line {
      margin-bottom: 2px;
    }

    .prompt {
      color: #7ee787;
    }

    .cmd {
      color: #d4d4d4;
    }

    .output {
      color: #a0a0a0;
    }

    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #d4d4d4;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .dock {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 8px 10px;
      background: var(--dock-bg);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 10px 40px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.5);
      z-index: 500;
    }

    .dock-item {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .dock-item:hover {
      transform: scale(1.25) translateY(-8px);
    }

    .dock-item:active {
      transform: scale(1.1) translateY(-4px);
    }

    .dock-icon {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.75);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.5);
    }

    .dock-icon svg {
      width: 24px;
      height: 24px;
    }

    .dock-separator {
      width: 1px;
      height: 36px;
      background: rgba(0,0,0,0.12);
      margin: 0 6px;
      align-self: center;
    }

    .dock-item.bounce {
      animation: dockBounce 0.45s ease;
    }

    @keyframes dockBounce {
      0%, 100% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.15) translateY(-14px); }
      50% { transform: scale(1.1) translateY(-6px); }
      70% { transform: scale(1.05) translateY(-10px); }
    }

    /* Shutdown overlay */
    #shutdown-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    #shutdown-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #shutdown-overlay img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.8s ease 0.6s;
    }

    #shutdown-overlay.active img {
      opacity: 1;
    }

    @media (max-width: 700px) {
      .desktop-icons {
        display: none;
      }
      .dock {
        padding: 6px 8px;
        gap: 2px;
      }
      .dock-item {
        width: 44px;
        height: 44px;
      }
      .dock-icon {
        width: 38px;
        height: 38px;
      }
      .dock-icon svg {
        width: 20px;
        height: 20px;
      }
      .window {
        min-width: 280px;
      }
      .menu-item:not(.active) {
        display: none;
      }
    }
  </style>
</head>

  </div>

  <!-- Shutdown overlay (hidden by default) -->
  <div id="shutdown-overlay">
    <img src="https://kappa.lol/YpKeTD" alt="" />
  </div>

  <template id="window-template">
    <div class="window" data-id="">
      <div class="titlebar">
        <div class="traffic-lights">
          <button class="tl close" title="Close"></button>
          <button class="tl minimize" title="Minimize"></button>
          <button class="tl maximize" title="Maximize"></button>
        </div>
        <div class="title"></div>
      </div>
      <div class="window-content"></div>
    </div>
  </template>

  <script>
    (() => {
      const windowsContainer = document.getElementById('windows-container');
      const template = document.getElementById('window-template');
      let zIndexCounter = 100;
      let openWindows = {};

      // Terminal state
      let terminalInputActive = false;
      let currentCommand = '';
      let terminalBodyEl = null;

      function updateClock() {
        const now = new Date();
        const opts = { weekday: 'short', hour: 'numeric', minute: '2-digit' };
        document.getElementById('clock').textContent = now.toLocaleString('en-US', opts);
      }
      updateClock();
      setInterval(updateClock, 30000);

      const windowContents = {
        about: {
          title: 'About SouloxFr',
          width: 460,
          height: 380,
          html: `
            <div class="content-header">
              <h1>SouloxFr</h1>
              <p>Independent Game Developer</p>
              <span class="badge"> Developing since 2022</span>
            </div>
            <div class="section">
              <h2>Who I Am</h2>
              <p> Hi, im soulox, I create VR and Roblox games. I am currently focused on my 2 main projects, The Looting Company (TLC) and Minigame Plaza (MGP)</p>
            </div>
            <div class="section">
              <h2>What I Do</h2>
              <ul class="feature-list">
                <li>Roblox experiences & systems design</li>
                <li>Meta Quest / VR exclusive titles</li>
                <li>Hello Neighbor Mods</li>
              </ul>
            </div>
            <div class="section">
              <h2>Currently</h2>
              <p>Creating <strong>Minigame Plaza</strong> on Roblox and developing <strong>The Looting Company</strong> as a Meta VR exclusive.</p>
            </div>
          `
        },
        projects: {
          title: 'Projects',
          width: 520,
          height: 360,
          html: `
            <div class="content-header">
              <h1>Projects</h1>
              <p>Selected work</p>
            </div>
            <div class="card-grid">
              <div class="card" data-open="minigame">
                <h3>Minigame Plaza</h3>
                <p> <strong> VERY EARLY BETA.</strong></p>
                <span class="tag">Roblox</span>
              </div>
              <div class="card" data-open="looting">
                <h3>The Looting Company</h3>
                <p>Meta VR exclusive extraction-style adventure. Loot, risk, extract.</p>
                <span class="tag">Meta VR</span>
              </div>
            </div>
            <p style="margin-top:18px;font-size:12.5px;color:var(--text-secondary)">Click a card to open the full project window.</p>
          `
        },
        minigame: {
          title: 'Minigame Plaza',
          width: 500,
          height: 420,
          html: `
            <div class="content-header">
              <h1>Minigame Plaza</h1>
              <p>Roblox Experience</p>
              <span class="badge roblox">Early Beta on Roblox (not public)</span>
            </div>
            <div class="section">
              <h2>Overview</h2>
              <p>Minigame Plaza is a social game where players jump between fast, polished minigames, hang out, and compete against eachother to win matches.</p>
            </div>
            <div class="section">
              <h2>Highlights</h2>
              <ul class="feature-list">
                <li>Multiple rotating minigames with easy winstreaks</li>
                <li>Smooth matchmaking</li>
                <li>Social plaza spaces</li>
                <li>Progressive Leaderboards</li>
                <li>Retro-UI's</li>
              </ul>
            </div>
            <div class="section">
              <h2>Status</h2>
              <p>Actively updating. Currently kept behind doors.</p>
            </div>
          `
        },
        looting: {
          title: 'The Looting Company',
          width: 500,
          height: 440,
          html: `
            <div class="content-header">
              <h1>The Looting Company</h1>
              <p>Meta VR Exclusive</p>
              <span class="badge vr">Meta Quest (unreleased currently)</span>
            </div>
            <div class="section">
              <h2>Overview</h2>
              <p>The Looting Company is a game. Thats all we can say for now.</p>
            </div>
            <div class="section">
              <h2>What Makes It Special</h2>
              <ul class="feature-list">
                <li>Exclusive to Meta platform</li>
              </ul>
            </div>
            <div class="section">
              <h2>Status</h2>
              <p>In active development. Built for your enjoyment</p>
            </div>
          `
        },
        contact: {
          title: 'Contact',
          width: 400,
          height: 340,
          html: `
            <div class="content-header">
              <h1>Get in Touch</h1>
              <p>Lets work together!</p>
            </div>
            <div class="contact-links">
              <a class="contact-link" href="https://www.roblox.com/users/2478640624/profile" target="_blank" rel="noopener">
                <span class="link-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="3"/>
                    <circle cx="8" cy="12" r="1.5" fill="#1d1d1f" stroke="none"/>
                    <path d="M7 10v4M6 12h4"/>
                  </svg>
                </span>
                <span>Roblox Profile</span>
              </a>
              <a class="contact-link" href="https://discord.com/users/1207085526750986253" onclick="return false;">
                <span class="link-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
                  </svg>
                </span>
                <span>Discord</span>
              </a>
            </div>
          `
        },
        terminal: {
          title: 'Terminal — souloxfr',
          width: 520,
          height: 320,
          isTerminal: true,
          html: `
            <div class="terminal-body" id="term-body">
              <div class="terminal-line"><span class="prompt">souloxfr@mac ~ %</span> <span class="cmd">whoami</span></div>
              <div class="terminal-line output">Velvetskye — Website Developer</div>
              <div class="terminal-line"><span class="prompt">souloxfr@mac ~ %</span> <span class="cmd">ls projects/</span></div>
              <div class="terminal-line output">Minigame_Plaza/    The_Looting_Company/</div>
              <div class="terminal-line"><span class="prompt">souloxfr@mac ~ %</span> <span class="cmd">cat status.txt</span></div>
              <div class="terminal-line output">Currently shipping fun. Building in public.</div>
              <div class="terminal-line"><span class="prompt">souloxfr@mac ~ %</span> <span class="cmd">echo "Thanks for stopping by"</span></div>
              <div class="terminal-line output">Thanks for stopping by</div>
              <div class="terminal-line" id="active-line"><span class="prompt">souloxfr@mac ~ %</span> <span class="cmd" id="typed-cmd"></span><span class="cursor-blink"></span></div>
            </div>
          `
        }
      };

      function triggerShutdown() {
        const overlay = document.getElementById('shutdown-overlay');
        if (!overlay) return;
        overlay.classList.add('active');
      }

      function appendTerminalLine(html, isOutput = false) {
        if (!terminalBodyEl) return;
        const line = document.createElement('div');
        line.className = 'terminal-line' + (isOutput ? ' output' : '');
        line.innerHTML = html;
        // Insert before the active line
        const active = document.getElementById('active-line');
        if (active) {
          terminalBodyEl.insertBefore(line, active);
        } else {
          terminalBodyEl.appendChild(line);
        }
        terminalBodyEl.scrollTop = terminalBodyEl.scrollHeight;
      }

      function processCommand(cmd) {
        const trimmed = cmd.trim().toLowerCase();
        if (trimmed === 'penis') {
          appendTerminalLine('<span class="prompt">souloxfr@mac ~ %</span> <span class="cmd">' + cmd + '</span>');
          appendTerminalLine('Initiating shutdown sequence...', true);
          setTimeout(triggerShutdown, 400);
          return;
        }
        // Echo the command
        appendTerminalLine('<span class="prompt">souloxfr@mac ~ %</span> <span class="cmd">' + (cmd || '') + '</span>');
        if (trimmed === 'clear' || trimmed === 'cls') {
          // Clear all but the active line
          const lines = terminalBodyEl.querySelectorAll('.terminal-line:not(#active-line)');
          lines.forEach(l => l.remove());
        } else if (trimmed === 'whoami') {
          appendTerminalLine('Velvetskye — Website Developer', true);
        } else if (trimmed === 'help') {
          appendTerminalLine('Available: whoami, clear, help, ls, echo ...', true);
        } else if (trimmed.startsWith('echo ')) {
          appendTerminalLine(cmd.slice(5), true);
        } else if (trimmed === 'ls' || trimmed === 'ls projects/') {
          appendTerminalLine('Minigame_Plaza/    The_Looting_Company/', true);
        } else if (trimmed) {
          appendTerminalLine('command not found: ' + cmd, true);
        }
        // Reset input
        currentCommand = '';
        const typed = document.getElementById('typed-cmd');
        if (typed) typed.textContent = '';
      }

      function setupTerminalInput(win) {
        const content = win.querySelector('.window-content');
        terminalBodyEl = content.querySelector('#term-body') || content.querySelector('.terminal-body');
        if (!terminalBodyEl) return;

        // Click on terminal focuses it for typing
        terminalBodyEl.addEventListener('click', () => {
          terminalInputActive = true;
          focusWindow(win);
        });

        // Also when window is focused
        win.addEventListener('mousedown', () => {
          if (win.dataset.id === 'terminal') {
            terminalInputActive = true;
          } else {
            terminalInputActive = false;
          }
        });
      }

      // Global key handler for terminal
      document.addEventListener('keydown', (e) => {
        // Escape still closes focused window
        if (e.key === 'Escape') {
          const focused = document.querySelector('.window.focused:not(.minimized)');
          if (focused) {
            closeWindow(focused.dataset.id);
            terminalInputActive = false;
          }
          return;
        }

        // Only handle typing when terminal is open and focused
        const termWin = openWindows['terminal'];
        if (!termWin || termWin.classList.contains('minimized') || !termWin.classList.contains('focused')) {
          terminalInputActive = false;
          return;
        }
        if (!terminalInputActive) return;

        // Don't capture if typing in some other input (none exist, but safety)
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        e.preventDefault();

        if (e.key === 'Enter') {
          processCommand(currentCommand);
        } else if (e.key === 'Backspace') {
          currentCommand = currentCommand.slice(0, -1);
          const typed = document.getElementById('typed-cmd');
          if (typed) typed.textContent = currentCommand;
        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          currentCommand += e.key;
          const typed = document.getElementById('typed-cmd');
          if (typed) typed.textContent = currentCommand;
        }
      });

      function createWindow(id) {
        if (openWindows[id]) {
          focusWindow(openWindows[id]);
          if (openWindows[id].classList.contains('minimized')) {
            openWindows[id].classList.remove('minimized');
          }
          bounceDock(id);
          if (id === 'terminal') {
            terminalInputActive = true;
          }
          return;
        }

        const def = windowContents[id];
        if (!def) return;

        const clone = template.content.cloneNode(true);
        const win = clone.querySelector('.window');
        win.dataset.id = id;
        win.style.width = def.width + 'px';
        win.style.height = def.height + 'px';

        const offsetX = (Math.random() - 0.5) * 80;
        const offsetY = (Math.random() - 0.5) * 40;
        win.style.left = 'calc(50% - ' + (def.width / 2) + 'px + ' + offsetX + 'px)';
        win.style.top = 'calc(50% - ' + (def.height / 2) + 'px + ' + offsetY + 'px)';

        win.querySelector('.title').textContent = def.title;
        const content = win.querySelector('.window-content');
        content.innerHTML = def.html;

        if (def.isTerminal) {
          content.style.padding = '0';
          content.style.background = '#1e1e1e';
        }

        win.querySelector('.tl.close').addEventListener('click', (e) => {
          e.stopPropagation();
          closeWindow(id);
        });
        win.querySelector('.tl.minimize').addEventListener('click', (e) => {
          e.stopPropagation();
          minimizeWindow(id);
        });
        win.querySelector('.tl.maximize').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleMaximize(id);
        });

        win.addEventListener('mousedown', () => focusWindow(win));
        makeDraggable(win);

        content.querySelectorAll('[data-open]').forEach(card => {
          card.addEventListener('click', () => openWindow(card.dataset.open));
        });

        windowsContainer.appendChild(win);
        openWindows[id] = win;
        focusWindow(win);
        bounceDock(id);

        if (id === 'terminal') {
          setupTerminalInput(win);
          terminalInputActive = true;
          currentCommand = '';
        }
      }

      function focusWindow(win) {
        zIndexCounter++;
        win.style.zIndex = zIndexCounter;
        document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
        win.classList.add('focused');
        if (win.dataset.id === 'terminal') {
          terminalInputActive = true;
        } else {
          terminalInputActive = false;
        }
      }

      function closeWindow(id) {
        const win = openWindows[id];
        if (!win) return;
        win.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
        win.style.opacity = '0';
        win.style.transform = 'scale(0.94)';
        setTimeout(() => {
          win.remove();
          delete openWindows[id];
          if (id === 'terminal') {
            terminalInputActive = false;
            currentCommand = '';
            terminalBodyEl = null;
          }
        }, 180);
      }

      function minimizeWindow(id) {
        const win = openWindows[id];
        if (!win) return;
        win.classList.add('minimized');
        if (id === 'terminal') terminalInputActive = false;
      }

      function toggleMaximize(id) {
        const win = openWindows[id];
        if (!win) return;
        win.classList.toggle('maximized');
      }

      function makeDraggable(win) {
        const titlebar = win.querySelector('.titlebar');
        let isDragging = false;
        let startX, startY, origX, origY;

        titlebar.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('tl')) return;
          if (win.classList.contains('maximized')) return;
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          origX = win.offsetLeft;
          origY = win.offsetTop;
          focusWindow(win);
          e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          win.style.left = (origX + dx) + 'px';
          win.style.top = Math.max(28, origY + dy) + 'px';
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
        });
      }

      function bounceDock(id) {
        const item = document.querySelector('.dock-item[data-window="' + id + '"]');
        if (item) {
          item.classList.remove('bounce');
          void item.offsetWidth;
          item.classList.add('bounce');
        }
      }

      function openWindow(id) {
        createWindow(id);
      }

      document.querySelectorAll('.desk-icon').forEach(icon => {
        icon.addEventListener('click', () => openWindow(icon.dataset.window));
      });

      document.querySelectorAll('.dock-item[data-window]').forEach(item => {
        item.addEventListener('click', () => openWindow(item.dataset.window));
      });

      document.getElementById('finder')?.addEventListener('click', () => openWindow('about'));

      setTimeout(() => openWindow('about'), 400);
    })();
  </script>
